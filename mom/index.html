<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Bloom"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#F4EFFB"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><link rel="manifest" href="manifest.json">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bloom – Your pregnancy journey</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4EFFB;--card:#FFFFFF;--ink:#3A2B4F;--soft:#7A6A91;--rose:#E5628A;--mint:#8FD3BC;--butter:#FFDB8E;--line:#E4DAF2;--glow:#FFE3EE;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1D1630;--card:#2A2142;--ink:#F3ECFF;--soft:#B5A6D0;--rose:#FF86A9;--mint:#7CCAB0;--butter:#F2C96E;--line:#3E3260;--glow:#4A2B4E}}
:root[data-theme="dark"]{--bg:#1D1630;--card:#2A2142;--ink:#F3ECFF;--soft:#B5A6D0;--rose:#FF86A9;--mint:#7CCAB0;--butter:#F2C96E;--line:#3E3260;--glow:#4A2B4E}
*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 Nunito,system-ui,sans-serif;min-height:100%}
main{max-width:480px;margin:0 auto;padding:20px 18px 40px}
h1,h2,.big{font-family:Fraunces,Georgia,serif;margin:0}
h1{font-size:28px;line-height:1.15}h2{font-size:19px;margin-bottom:6px}
p{margin:0}.soft{color:var(--soft)}.small{font-size:14px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.link{background:none;border:0;color:var(--rose);font:600 14px Nunito,sans-serif;cursor:pointer;padding:6px 0;text-decoration:underline}
.hero{text-align:center;margin:6px 0 18px}
.ringwrap{position:relative;width:250px;height:250px;margin:0 auto}
.ringwrap svg{position:absolute;inset:0;transform:rotate(-90deg)}
.nest{position:absolute;inset:26px;border-radius:50%;background:radial-gradient(circle,var(--glow) 0%,var(--card) 72%);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 28px rgba(229,98,138,.18)}
.fruit{font-size:86px;line-height:1;animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
@media(prefers-reduced-motion:reduce){.fruit{animation:none}}
.wk{font-family:Fraunces,serif;font-weight:800;font-size:30px;margin-top:10px}
.sub{color:var(--soft);font-weight:600}
.size{font-size:18px;margin-top:2px}
.pill{display:inline-block;background:var(--butter);color:#4A3513;font-weight:800;border-radius:99px;padding:5px 14px;margin-top:10px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px}
.mom{background:var(--glow);border-color:transparent;border-radius:22px 22px 22px 6px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat b{display:block;font-family:Fraunces,serif;font-size:22px}
.bar{height:10px;background:var(--line);border-radius:9px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--mint);border-radius:9px;transition:width .3s}
.tri{position:relative;height:14px;border-radius:9px;display:flex;overflow:hidden;margin:14px 0 6px}
.tri span{flex:1;background:var(--line)}.tri span:nth-child(1){flex:14}.tri span:nth-child(2){flex:13}.tri span:nth-child(3){flex:13}
.tri .on{background:var(--mint)}
.tl{display:flex;font-size:12px;color:var(--soft);font-weight:600}.tl span:nth-child(1){flex:14}.tl span:nth-child(2){flex:13}.tl span:nth-child(3){flex:13}
input[type=range]{width:100%;accent-color:var(--rose);margin:10px 0 4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{background:var(--rose);color:var(--card);border:0;border-radius:99px;padding:12px 22px;font:800 16px Nunito,sans-serif;cursor:pointer}
.btn.alt{background:var(--card);color:var(--rose);border:2px solid var(--rose)}
.kick{width:78px;height:78px;border-radius:50%;font-size:34px;background:var(--mint);border:0;cursor:pointer}
.kick:active{transform:scale(.92)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
label{display:block;font-weight:800;margin:16px 0 6px}
input[type=date],select{width:100%;padding:13px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:600 16px Nunito,sans-serif}
.intro{text-align:center;padding-top:30px}.intro .fruit{font-size:72px;display:block;margin-bottom:10px}
.err{color:var(--rose);font-weight:700;margin-top:10px;min-height:22px}
input[type=text],input[type=time]{width:100%;min-width:0;padding:13px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:600 16px Nunito,sans-serif}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;margin-top:8px}
.two input{min-width:0}
.ai{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.chip{background:var(--glow);border:0;color:var(--ink);border-radius:99px;padding:7px 12px;font:600 13px Nunito,sans-serif;cursor:pointer}
.nextb{border-radius:18px;padding:14px 16px;margin-bottom:14px;background:var(--card);border:2px solid var(--mint)}
.nextb.soon{background:var(--butter);border-color:var(--butter);color:#4A3513}
.hero{margin:4px 0 14px}
.hrow{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:12px}
.hrow .wk{font-size:36px;line-height:1;margin:0}.hrow .sub{margin-top:4px;font-size:14px}
.hrow .pill{margin:0 0 4px;text-align:center}
.stage{position:relative;height:224px;border-radius:30px;border:1px solid var(--line);background:radial-gradient(circle at 50% 46%,var(--glow),var(--card) 78%);display:flex;align-items:center;justify-content:center;overflow:hidden}
.ghost{position:absolute;width:192px;height:192px;border:2px dashed var(--line);border-radius:50%}
.ghost::after{content:'full term';position:absolute;top:-1px;left:50%;transform:translate(-50%,-50%);background:var(--card);padding:0 6px;font:700 10px Nunito,sans-serif;color:var(--soft)}
.prod{position:relative;transition:width .4s ease,height .4s ease;filter:drop-shadow(0 8px 10px rgba(0,0,0,.18))}
.prod svg{width:100%;height:100%;display:block}
.peek{position:absolute;left:10px;bottom:10px;width:84px;height:84px;border-radius:50%;border:3px solid var(--card);box-shadow:0 4px 12px rgba(0,0,0,.14)}
.peek svg{width:100%;height:100%;border-radius:50%;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-3px)}}
@media(prefers-reduced-motion:reduce){.peek svg{animation:none}.prod{transition:none}}
.hero .size{text-align:center;margin:14px 0 0;font-size:19px}.hero .meas{text-align:center;margin-top:2px}
.jt{position:relative;height:50px;margin-top:8px}
.trk{position:absolute;left:0;right:0;top:21px;height:8px;border-radius:8px;background:var(--line)}
.trk i{position:absolute;left:0;top:0;height:100%;border-radius:8px;background:var(--mint);transition:width .25s}
#dots{position:absolute;inset:0;pointer-events:none}
#dots i{position:absolute;top:19px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--card);border:2px solid var(--line);z-index:1}
#dots i.on{background:var(--mint);border-color:var(--mint)}
#dots i.cur{background:var(--rose);border-color:var(--rose);transform:scale(1.35)}
.jt input{position:absolute;inset:0;width:100%;height:100%;margin:0;background:transparent;-webkit-appearance:none;appearance:none;z-index:2}
.jt input::-webkit-slider-runnable-track{height:50px;background:transparent}
.jt input::-moz-range-track{background:transparent}
.jt input::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:11px;border-radius:50%;background:var(--rose);border:4px solid var(--card);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.jt input::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--rose);border:4px solid var(--card)}
.tlab{position:relative;height:16px;font-size:11px;font-weight:700;color:var(--soft)}
.tlab span{position:absolute;left:calc(14px + (100% - 28px) * var(--f));transform:translateX(-50%);white-space:nowrap}
.mcap{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:10px 8px;margin-top:8px}
.mtxt{flex:1;min-width:0;text-align:center}.mtxt small{display:block;color:var(--soft);font-weight:700;font-size:12px}
.mtxt b{display:block;font:800 19px Fraunces,serif}.mtxt span{display:block;color:var(--soft);font-size:14px;line-height:1.35}
.mb{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--glow);color:var(--ink);font-size:24px;cursor:pointer}.mb:disabled{opacity:.3}
footer{font-size:12px;color:var(--soft);text-align:center;margin-top:18px}
</style></head><body><main id="app"></main>
