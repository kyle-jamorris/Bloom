  const C=2*Math.PI*112;

  <section class="hero">
  <div class="hrow"><div><div class="wk" id="wk"></div><div class="sub" id="sub"></div></div><span class="pill" id="pill"></span></div>

</section>
<div id="next"></div>
  
<div class="card dev"><div class="bb" id="baby"></div><div><h2>What’s happening</h2><p id="dev"></p></div></div>
  <div class="card mom"><h2>How you can help</h2><p id="mom"></p></div>

  <div class="card"><h2>Upcoming</h2><div id="alist"></div>

  <label class="fl" for="ad">Date</label><input type="date" id="ad">

  </div><div class="pg" id="pg-m"><h1 class="gr">More</h1>

  $('#dueline').textContent='Due '+dueTxt;$('#srcline').textContent=store.get('bloomdad-src')||'';
