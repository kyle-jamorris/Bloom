  const shSum=i=>['baby development'].concat(i.sh&&i.sh.a?['appointments']:[],i.sh&&i.sh.t?['care team']:[],i.sh&&i.sh.c?['clinics']:[]).join(', ');
  function rstI(){edI=null;$('#in').value='';setv($('#ir'),FR[0]);['ia','it','ic'].forEach(x=>$('#'+x).checked=false);$('#iadd').textContent='Create link';$('#s-i-t').textContent='Invite someone';$('#iform').style.display='';$('#ires').style.display='none';closeSh('s-i')}
  function rI(){
    const L=live(INV);
    $('#ilist').innerHTML=L.length?L.map(i=>`<div class="ai" tabindex="0" role="button" aria-expanded="false"><div class="av" style="background:${COL[(FR.indexOf(i.role)+1)%COL.length]}">${esc(ini(i.name))}</div><div class="ac"><b>${esc(i.name)}</b><span class="soft small">${esc(i.role)}</span><span class="soft small">Sees: ${shSum(i)}</span><div class="acts"><button class="ab2 cal" data-ic="${i.id}">${I.copy}Copy link</button>${navigator.share?`<button class="ab2" data-is="${i.id}">Share</button>`:''}<button class="ab2" data-ie="${i.id}">${I.edit}Edit</button><button class="ab2 del" data-ix="${i.id}" aria-label="Remove ${esc(i.name)}">${I.del}Remove</button></div></div><i class="chev">›</i></div>`).join(''):'<p class="soft small">No one invited yet.</p>';
    const g=id=>INV.find(x=>x.id===+id);
    $('#ilist').querySelectorAll('[data-ic]').forEach(b=>b.onclick=()=>{copyTxt(fam()+'?t='+g(b.dataset.ic).tok);b.lastChild.textContent='Copied'});
    $('#ilist').querySelectorAll('[data-is]').forEach(b=>b.onclick=()=>navigator.share({title:'Bloom',text:'Follow our baby’s journey. When it opens, tap Share, then Add to Home Screen to keep it handy.',url:fam()+'?t='+g(b.dataset.is).tok}).catch(()=>{}));
    $('#ilist').querySelectorAll('[data-ie]').forEach(b=>b.onclick=()=>{const i=g(b.dataset.ie);edI=i.id;$('#in').value=i.name;setv($('#ir'),i.role);$('#ia').checked=!!(i.sh&&i.sh.a);$('#it').checked=!!(i.sh&&i.sh.t);$('#ic').checked=!!(i.sh&&i.sh.c);$('#iadd').textContent='Save changes';$('#s-i-t').textContent='Edit invite';openSh('s-i')});
    $('#ilist').querySelectorAll('[data-ix]').forEach(b=>b.onclick=()=>{if(!confirm('Remove this person? Their link will stop working.'))return;const i=g(b.dataset.ix);i.del=true;i.tok='';i.u=Date.now();saveI();rI();sync()});
    rN();
  }
  function showLink(inv){const u=fam()+'?t='+inv.tok;$('#irn').textContent=inv.name;$('#ilk').value=u;$('#iform').style.display='none';$('#ires').style.display='block';$('#s-i-t').textContent='Link ready';$('#icp').textContent='Copy link';$('#ish').style.display=navigator.share?'':'none';$('#icp').onclick=()=>{copyTxt(u);$('#icp').textContent='Copied'};$('#ish').onclick=()=>navigator.share({title:'Bloom',text:'Follow our baby’s journey. When it opens, tap Share, then Add to Home Screen to keep it handy.',url:u}).catch(()=>{});$('#idone').onclick=rstI;rI()}
  $('#iopen').onclick=()=>{if(!hh){setSt('Turn on sharing first, then you can invite family.');const c=$('#syncc');if(c&&c.scrollIntoView)c.scrollIntoView({behavior:'smooth',block:'center'});return}rstI();openSh('s-i')};
  $('#iadd').onclick=()=>{const n=$('#in').value.trim();if(!n){$('#in').focus();return}const sh={a:+$('#ia').checked,t:+$('#it').checked,c:+$('#ic').checked},o={name:n.slice(0,60),role:$('#ir').value,sh,u:Date.now()};if(edI){Object.assign(INV.find(x=>x.id===edI),o);saveI();rstI();rI();return}const inv=Object.assign({id:Date.now(),tok:rndT()},o);INV.push(inv);saveI();clearTimeout(syncT);sync();showLink(inv)};
  function rN(){const e=$('#nudge');if(!e)return;if(!API||live(INV).length||store.get(PK+'-nudge')){e.innerHTML='';return}e.innerHTML='<div class="nudge"><b>Share the journey</b><span>Invite grandparents and friends to follow along. You choose what each person sees.</span><div class="acts" style="display:flex"><button class="ab2 cal" id="ngo">Set up sharing</button><button class="ab2" id="nno">Not now</button></div></div>';$('#ngo').onclick=()=>{go('m');const t=$('#syncc');if(t&&t.scrollIntoView)t.scrollIntoView({behavior:'smooth',block:'start'})};$('#nno').onclick=()=>{store.set(PK+'-nudge','1');rN()}}
  rS();rI();rN();sync();window.__bloomSync=sync;
  if(!window.__bloomVisL){window.__bloomVisL=1;document.addEventListener('visibilitychange',()=>{if(!document.hidden&&window.__bloomSync)window.__bloomSync()})}



  upd();
  if(wk<2)$('#pill').textContent='Very early days. Your journey begins here.';
}

const saved=store.get('bloomdad-due');
if(saved){due=parse(saved);view=null;main()}else setup();
</script></body></html>
